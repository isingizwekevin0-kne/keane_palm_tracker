<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#14171C" />
<title>Kevin's Ledger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2314171C'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='%23C9A44C' font-family='serif'%3E%E2%82%B3%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#EDE8DD; --ink-dim:#9098A8; --bg:#14171C; --surface:#1B1F27; --surface2:#20252F;
    --rule:#2B303B; --gold:#C9A44C; --teal:#5B9E92; --red:#C1594C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  body{
    background-image: repeating-linear-gradient(var(--bg), var(--bg) 35px, #2B303B22 36px);
    min-height:100vh; padding-bottom:90px;
  }
  .serif{font-family: Georgia, 'Times New Roman', serif;}
  .mono{font-family: 'Courier New', monospace;}
  .wrap{max-width:520px; margin:0 auto; padding:20px 16px 0;}
  .masthead{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--rule); padding-bottom:14px; margin-bottom:18px;}
  .masthead h1{font-size:26px; margin:0;}
  .masthead p{color:var(--ink-dim); font-size:12px; margin:4px 0 0;}
  select{background:var(--surface); border:1px solid var(--rule); color:var(--ink); font-size:12px; padding:6px 8px; border-radius:4px;}
  .card{background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:18px; margin-bottom:16px;}
  .label{color:var(--ink-dim); font-size:11px; text-transform:uppercase; letter-spacing:0.08em;}
  .balance{font-size:36px; margin:4px 0 0;}
  .split3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px; padding-top:14px; border-top:1px dashed var(--rule);}
  .bar-track{width:100%; height:8px; background:var(--rule); border-radius:99px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px; transition:width .4s;}
  .row{display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--rule);}
  .row:last-child{border-bottom:none;}
  .tx-left{display:flex; align-items:center; gap:10px;}
  .icon-badge{width:30px; height:30px; border-radius:99px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:15px;}
  .cat-dot{width:9px; height:9px; border-radius:99px; display:inline-block; margin-right:6px;}
  .stamp{display:inline-flex; align-items:center; border:2px solid var(--gold); color:var(--gold); font-size:9px; text-transform:uppercase; letter-spacing:0.1em; padding:3px 9px; border-radius:99px; transform:rotate(-3deg);}
  .stamp.teal{border-color:var(--teal); color:var(--teal);}
  .stamp.red{border-color:var(--red); color:var(--red);}
  .btn{border:none; border-radius:6px; padding:10px; font-size:13px; font-family:inherit; width:100%; cursor:pointer;}
  .btn-gold{background:var(--gold); color:var(--bg);}
  .btn-teal{background:var(--teal); color:var(--bg);}
  input, textarea{width:100%; background:var(--surface2); border:1px solid var(--rule); color:var(--ink); font-size:14px; padding:9px 10px; border-radius:5px; margin-bottom:8px; font-family:inherit;}
  .tabbar{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--rule); padding:6px 8px calc(6px + env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:space-between; gap:2px; z-index:10;}
  .tab-btn{background:none; border:none; color:var(--ink-dim); display:flex; flex-direction:column; align-items:center; gap:2px; font-size:8px; text-transform:uppercase; letter-spacing:0.04em; padding:4px 3px; cursor:pointer; flex:1; min-width:0;}
  .tab-btn.active{color:var(--gold);}
  .tab-btn .glyph{font-size:15px;}
  .fab{background:var(--gold); color:var(--bg); border:none; border-radius:50%; width:38px; height:38px; font-size:17px; font-weight:600; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .modal-overlay{position:fixed; inset:0; background:#000000aa; display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal{background:var(--surface); border:1px solid var(--rule); width:100%; max-width:520px; border-radius:14px 14px 0 0; padding:20px; padding-bottom:calc(20px + env(safe-area-inset-bottom));}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .close-x{background:none; border:none; color:var(--ink-dim); font-size:20px; cursor:pointer;}
  .type-toggle{display:flex; border:1px solid var(--rule); border-radius:5px; overflow:hidden; margin-bottom:12px;}
  .type-toggle button{flex:1; padding:9px; border:none; font-size:12px; cursor:pointer; background:var(--surface2); color:var(--ink-dim); font-family:inherit;}
  .type-toggle button.active-expense{background:var(--red); color:var(--bg);}
  .type-toggle button.active-income{background:var(--teal); color:var(--bg);}
  .catgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:8px;}
  .catgrid button{background:transparent; border:1px solid var(--rule); border-radius:5px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; font-family:inherit;}
  .catgrid button.sel{border-width:2px;}
  .catgrid .glyph{font-size:16px;}
  .catgrid .name{font-size:8px; color:var(--ink-dim);}
  .tabhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .tabhead h2{font-size:20px; margin:0;}
  .pill-btn{background:var(--gold); color:var(--bg); border:none; border-radius:99px; padding:7px 14px; font-size:12px; cursor:pointer;}
  .donut{width:110px; height:110px; border-radius:50%; flex-shrink:0;}
  .legend-row{display:flex; justify-content:space-between; font-size:12px; padding:3px 0;}
  .trend-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .trend-label{width:32px; font-size:10px; color:var(--ink-dim);}
  .trend-bars{flex:1; display:flex; flex-direction:column; gap:2px;}
  .trend-bar-track{background:var(--rule); border-radius:3px; height:6px; overflow:hidden;}
  .trend-bar-fill{height:100%; border-radius:3px;}
  .empty{color:var(--ink-dim); font-size:12px;}
  .del-btn{background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:13px;}
  .banner{background:#C1594C22; color:var(--red); font-size:11px; padding:8px 10px; border-radius:5px; margin-bottom:12px; font-family:'Courier New',monospace;}
  .install-hint{background:#5B9E9222; color:var(--teal); font-size:11px; padding:10px 12px; border-radius:5px; margin-bottom:16px; line-height:1.5;}
  .tip-hero{border-left:4px solid var(--gold); background:var(--surface2);}
  .insight{display:flex; gap:10px; padding:11px 0; border-bottom:1px dashed var(--rule); align-items:flex-start;}
  .insight:last-child{border-bottom:none;}
  .insight-dot{width:9px; height:9px; border-radius:99px; margin-top:4px; flex-shrink:0;}
  .insight-text{font-size:12.5px; line-height:1.45;}
  .insight-text b{color:var(--ink);}
  .tone-red .insight-dot{background:var(--red);}
  .tone-gold .insight-dot{background:var(--gold);}
  .tone-teal .insight-dot{background:var(--teal);}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="masthead">
    <div>
      <h1 class="serif">Kevin's Ledger</h1>
      <p class="mono" id="dateLine"></p>
    </div>
    <select id="currencySelect"></select>
  </div>
  <div id="installHint"></div>
  <div id="content"></div>
</div>

<div class="tabbar">
  <button class="tab-btn" data-tab="dashboard"><span class="glyph">📒</span>Ledger</button>
  <button class="tab-btn" data-tab="goals"><span class="glyph">🎯</span>Goals</button>
  <button class="tab-btn" data-tab="bills"><span class="glyph">🔔</span>Bills</button>
  <button class="tab-btn" data-tab="journal"><span class="glyph">📖</span>Journal</button>
  <button class="tab-btn" data-tab="advisor"><span class="glyph">🤖</span>Advisor</button>
  <button class="fab" id="addBtn">＋</button>
</div>

<div id="modalRoot"></div>

<script>
(function(){
  "use strict";

  var STORE_KEY = "kevin-ledger-data-v1";
  var CATEGORIES = [
    {key:"Food", glyph:"🍔", color:"#C9A44C"},
    {key:"Transport", glyph:"🚗", color:"#5B9E92"},
    {key:"Entertainment", glyph:"🎮", color:"#8B7FD1"},
    {key:"Gadgets", glyph:"📱", color:"#4E9BD1"},
    {key:"School", glyph:"🎓", color:"#D18A4E"},
    {key:"Bills", glyph:"💡", color:"#C1594C"},
    {key:"Personal", glyph:"❤️", color:"#D16E9C"},
    {key:"Business", glyph:"💼", color:"#7FA84E"},
    {key:"Savings", glyph:"🏦", color:"#5B8FD1"},
    {key:"Other", glyph:"⋯", color:"#8B93A1"}
  ];
  var CURRENCIES = {
    RWF:{symbol:"FRw"}, USD:{symbol:"$"}, FBU:{symbol:"FBu"}, CDF:{symbol:"FC"}
  };
  var DEFAULT_DATA = {
    currency:"RWF",
    transactions:[],
    goals:[{id:uid(), name:"Emergency Fund", target:100000, current:0, emoji:"🛟"}],
    bills:[],
    journal:[]
  };

  var state = null;
  var tab = "dashboard";

  function uid(){ return Math.random().toString(36).slice(2,10); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function monthKey(d){ return d.slice(0,7); }
  function catMeta(key){
    for (var i=0;i<CATEGORIES.length;i++) if (CATEGORIES[i].key===key) return CATEGORIES[i];
    return CATEGORIES[CATEGORIES.length-1];
  }
  function fmt(n, currency){
    var c = CURRENCIES[currency] || CURRENCIES.RWF;
    var val = Math.round(Number(n)||0);
    return c.symbol + " " + val.toLocaleString();
  }
  function esc(s){
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return Object.assign({}, DEFAULT_DATA, JSON.parse(raw));
    }catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch(e){ showBanner("Couldn't save — your browser may be blocking storage."); }
  }
  function showBanner(msg){
    var el = document.getElementById("content");
    var b = document.createElement("div");
    b.className = "banner";
    b.textContent = msg;
    el.prepend(b);
  }

  // ---------- derived data ----------
  function monthTx(){
    var mk = monthKey(todayISO());
    return state.transactions.filter(function(t){ return monthKey(t.date)===mk; });
  }
  function sumBy(list, type){
    return list.filter(function(t){return t.type===type;}).reduce(function(s,t){return s+Number(t.amount);},0);
  }
  function computeStats(){
    var mtx = monthTx();
    var monthIncome = sumBy(mtx,"income");
    var monthExpense = sumBy(mtx,"expense");
    var balance = state.transactions.reduce(function(s,t){return s + (t.type==="income"?Number(t.amount):-Number(t.amount));},0);
    var moneyLeft = monthIncome - monthExpense;
    var savingsPct = monthIncome>0 ? Math.max(0, Math.round(moneyLeft/monthIncome*100)) : 0;
    var spendRatio = monthIncome>0 ? monthExpense/monthIncome : (monthExpense>0?1:0);
    var healthScore = Math.max(0, Math.min(100, Math.round(100 - spendRatio*100)));
    return {monthIncome:monthIncome, monthExpense:monthExpense, balance:balance, moneyLeft:moneyLeft, savingsPct:savingsPct, healthScore:healthScore};
  }
  function byCategory(){
    var map = {};
    monthTx().filter(function(t){return t.type==="expense";}).forEach(function(t){
      map[t.category] = (map[t.category]||0) + Number(t.amount);
    });
    return Object.keys(map).map(function(k){
      var m = catMeta(k);
      return {key:k, value:map[k], glyph:m.glyph, color:m.color};
    }).sort(function(a,b){return b.value-a.value;});
  }
  function trend(){
    var months=[];
    for (var i=5;i>=0;i--){
      var d = new Date();
      d.setMonth(d.getMonth()-i);
      var key = d.toISOString().slice(0,7);
      var label = d.toLocaleDateString("en-US",{month:"short"});
      var exp = sumBy(state.transactions.filter(function(t){return monthKey(t.date)===key;}),"expense");
      var inc = sumBy(state.transactions.filter(function(t){return monthKey(t.date)===key;}),"income");
      months.push({label:label, spent:exp, earned:inc});
    }
    return months;
  }
  function daysUntil(dateStr){
    return Math.ceil((new Date(dateStr) - new Date(todayISO())) / 86400000);
  }

  // ---------- advisor engine (rule-based, fully offline) ----------
  function categoryAverage(catKey, excludeCurrent){
    var mk = monthKey(todayISO());
    var byMonth = {};
    state.transactions.forEach(function(t){
      if (t.type!=="expense" || t.category!==catKey) return;
      var k = monthKey(t.date);
      if (excludeCurrent && k===mk) return;
      byMonth[k] = (byMonth[k]||0) + Number(t.amount);
    });
    var keys = Object.keys(byMonth);
    if (keys.length===0) return null;
    var total = keys.reduce(function(s,k){return s+byMonth[k];},0);
    return total / keys.length;
  }

  function computeInsights(){
    var insights = [];
    var s = computeStats();
    var mk = monthKey(todayISO());

    // overdue / due-soon bills
    state.bills.forEach(function(b){
      var d = daysUntil(b.dueDate);
      if (d < 0){
        insights.push({tone:"red", text:'<b>'+esc(b.name)+'</b> is overdue by '+Math.abs(d)+' day'+(Math.abs(d)===1?'':'s')+' ('+fmt(b.amount,state.currency)+').'});
      } else if (d <= 3){
        insights.push({tone:"red", text:'<b>'+esc(b.name)+'</b> is due in '+d+' day'+(d===1?'':'s')+' — set aside '+fmt(b.amount,state.currency)+'.'});
      } else if (d <= 7){
        insights.push({tone:"gold", text:'<b>'+esc(b.name)+'</b> comes up in '+d+' days ('+fmt(b.amount,state.currency)+').'});
      }
    });

    // category spend vs personal average
    byCategory().forEach(function(c){
      var avg = categoryAverage(c.key, true);
      if (avg && avg>0){
        var ratio = c.value/avg;
        if (ratio >= 1.2){
          insights.push({tone:"red", text:'<b>'+esc(c.key)+'</b> spending is '+Math.round((ratio-1)*100)+'% above your usual monthly average.'});
        } else if (ratio <= 0.7){
          insights.push({tone:"teal", text:'<b>'+esc(c.key)+'</b> spending is '+Math.round((1-ratio)*100)+'% below your usual — nice control.'});
        }
      }
    });

    // overall spend vs income this month
    if (s.monthIncome>0 && s.monthExpense > s.monthIncome){
      insights.push({tone:"red", text:"You've spent more than you've earned this month. Consider pausing non-essential purchases."});
    } else if (s.monthIncome>0 && s.savingsPct >= 40){
      insights.push({tone:"teal", text:"You're saving "+s.savingsPct+"% of income this month — solid pace toward your goals."});
    }

    // goal progress nudge
    var goalsSorted = state.goals.slice().sort(function(a,b){ return (b.current/b.target)-(a.current/a.target); });
    if (goalsSorted[0]){
      var top = goalsSorted[0];
      var pct = top.target>0 ? top.current/top.target*100 : 0;
      if (pct >= 70 && pct < 100){
        insights.push({tone:"gold", text:'Almost there — <b>'+esc(top.name)+'</b> is '+Math.round(pct)+'% funded.'});
      } else if (pct===0 && top.target>0){
        insights.push({tone:"gold", text:'<b>'+esc(top.name)+'</b> hasn\'t had a contribution yet. Even a small deposit keeps momentum.'});
      }
    }

    // journal reflection
    if (state.journal.length>0 && state.journal[0].worthIt===false){
      insights.push({tone:"gold", text:"Your last journal entry was marked a regret — worth pausing before the next non-essential buy."});
    }

    if (insights.length===0){
      insights.push({tone:"teal", text:"No alerts right now — log a few more entries and I'll start spotting patterns."});
    }

    // priority sort: red > gold > teal
    var order = {red:0, gold:1, teal:2};
    insights.sort(function(a,b){ return order[a.tone]-order[b.tone]; });
    return insights;
  }

  // ---------- render: dashboard ----------
  function renderDashboard(){
    var s = computeStats();
    var cats = byCategory();
    var tr = trend();
    var maxTrend = Math.max(1, Math.max.apply(null, tr.map(function(m){return Math.max(m.spent,m.earned);})));
    var healthColor = s.healthScore>=70? "var(--teal)" : s.healthScore>=40? "var(--gold)" : "var(--red)";

    var donutStops = "";
    var acc = 0;
    var total = cats.reduce(function(s,c){return s+c.value;},0) || 1;
    cats.forEach(function(c){
      var start = acc/total*360;
      acc += c.value;
      var end = acc/total*360;
      donutStops += c.color+" "+start.toFixed(1)+"deg "+end.toFixed(1)+"deg,";
    });
    donutStops = donutStops ? donutStops.slice(0,-1) : "var(--rule) 0deg 360deg";

    var topGoal = state.goals.slice().sort(function(a,b){ return (b.current/b.target)-(a.current/a.target); })[0];
    var upcomingBills = state.bills.slice().sort(function(a,b){ return a.dueDate.localeCompare(b.dueDate); }).slice(0,4);
    var recent = state.transactions.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).slice(0,6);

    var html = "";
    html += '<div class="card">'
      + '<div class="label">Current Balance</div>'
      + '<div class="balance mono">'+fmt(s.balance,state.currency)+'</div>'
      + '<div class="split3">'
      + '<div><div class="label">Left this month</div><div class="mono" style="font-size:13px;color:'+(s.moneyLeft>=0?'var(--teal)':'var(--red)')+'">'+fmt(s.moneyLeft,state.currency)+'</div></div>'
      + '<div><div class="label">Savings</div><div class="mono" style="font-size:13px">'+s.savingsPct+'%</div></div>'
      + '<div><div class="label">Health</div><div class="mono" style="font-size:13px;color:'+healthColor+'">'+s.healthScore+'/100</div></div>'
      + '</div></div>';

    html += '<div class="card"><div class="serif" style="font-size:16px;margin-bottom:10px;">This month\'s spending</div>';
    if (cats.length===0){
      html += '<div class="empty">No expenses logged yet — tap Add to start.</div>';
    } else {
      html += '<div style="display:flex;align-items:center;gap:14px;">';
      html += '<div class="donut" style="background:conic-gradient('+donutStops+');"></div>';
      html += '<div style="flex:1;">';
      cats.forEach(function(c){
        html += '<div class="legend-row"><span><span class="cat-dot" style="background:'+c.color+'"></span>'+esc(c.key)+'</span><span class="mono">'+fmt(c.value,state.currency)+'</span></div>';
      });
      html += '</div></div>';
    }
    html += '</div>';

    html += '<div class="card"><div class="serif" style="font-size:16px;margin-bottom:10px;">6-month trend</div>';
    tr.forEach(function(m){
      html += '<div class="trend-row"><div class="trend-label mono">'+m.label+'</div><div class="trend-bars">'
        + '<div class="trend-bar-track"><div class="trend-bar-fill" style="width:'+(m.earned/maxTrend*100)+'%;background:var(--teal)"></div></div>'
        + '<div class="trend-bar-track"><div class="trend-bar-fill" style="width:'+(m.spent/maxTrend*100)+'%;background:var(--red)"></div></div>'
        + '</div></div>';
    });
    html += '<div style="display:flex;gap:14px;margin-top:4px;"><span class="mono" style="font-size:9px;color:var(--teal)">▬ earned</span><span class="mono" style="font-size:9px;color:var(--red)">▬ spent</span></div>';
    html += '</div>';

    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">';
    html += '<div class="card" style="margin-bottom:0;"><div class="label" style="margin-bottom:8px;">Next goal</div>';
    if (topGoal){
      var pct = topGoal.target>0 ? topGoal.current/topGoal.target*100 : 0;
      html += '<div class="serif" style="font-size:14px;">'+topGoal.emoji+' '+esc(topGoal.name)+'</div>'
        + '<div class="bar-track" style="margin-top:8px;"><div class="bar-fill" style="width:'+Math.min(100,pct)+'%;background:var(--gold);"></div></div>'
        + '<div class="mono" style="font-size:11px;color:var(--ink-dim);margin-top:4px;">'+fmt(topGoal.current,state.currency)+' / '+fmt(topGoal.target,state.currency)+'</div>';
    } else { html += '<div class="empty">No goals yet.</div>'; }
    html += '</div>';

    html += '<div class="card" style="margin-bottom:0;"><div class="label" style="margin-bottom:8px;">Upcoming bills</div>';
    if (upcomingBills.length===0){ html += '<div class="empty">No bills tracked.</div>'; }
    else {
      upcomingBills.forEach(function(b){
        var d = daysUntil(b.dueDate);
        html += '<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;"><span>'+esc(b.name)+'</span><span class="mono" style="color:'+(d<3?'var(--red)':'var(--ink-dim)')+'">'+(d<0?'overdue':d+'d')+'</span></div>';
      });
    }
    html += '</div></div>';

    html += '<div class="card" style="margin-top:14px;"><div class="serif" style="font-size:16px;margin-bottom:10px;">Recent entries</div>';
    if (recent.length===0){ html += '<div class="empty">Nothing logged yet.</div>'; }
    else {
      recent.forEach(function(t){
        var meta = t.type==="expense" ? catMeta(t.category) : {glyph:"💰", color:"var(--teal)"};
        html += '<div class="row"><div class="tx-left"><div class="icon-badge">'+meta.glyph+'</div>'
          + '<div><div style="font-size:12px;">'+esc(t.note||t.category)+'</div><div class="mono" style="font-size:10px;color:var(--ink-dim);">'+t.date+'</div></div></div>'
          + '<div style="display:flex;align-items:center;gap:8px;"><span class="mono" style="font-size:12px;color:'+(t.type==="income"?'var(--teal)':'var(--red)')+'">'+(t.type==="income"?"+":"-")+fmt(t.amount,state.currency)+'</span>'
          + '<button class="del-btn" data-del-tx="'+t.id+'">✕</button></div></div>';
      });
    }
    html += '</div>';

    return html;
  }

  // ---------- render: goals ----------
  function renderGoals(){
    var html = '<div class="tabhead"><h2 class="serif">Goals</h2><button class="pill-btn" id="goalToggle">+ New goal</button></div>';
    html += '<div id="goalForm" style="display:none;" class="card">'
      + '<input id="goalEmoji" placeholder="Emoji (e.g. 🎮)" value="🎯" />'
      + '<input id="goalName" placeholder="Goal name (e.g. PS5)" />'
      + '<input id="goalTarget" type="number" placeholder="Target amount" />'
      + '<button class="btn btn-teal" id="goalSave">Save goal</button>'
      + '</div>';

    state.goals.forEach(function(g){
      var pct = g.target>0 ? g.current/g.target*100 : 0;
      var done = pct>=100;
      html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;">'
        + '<div class="serif" style="font-size:15px;">'+g.emoji+' '+esc(g.name)+'</div>'
        + '<div style="display:flex;align-items:center;gap:8px;">'
        + (done?'<span class="stamp teal">Reached</span>':'')
        + '<button class="del-btn" data-del-goal="'+g.id+'">✕</button></div></div>'
        + '<div class="bar-track" style="margin-top:8px;"><div class="bar-fill" style="width:'+Math.min(100,pct)+'%;background:'+(done?'var(--teal)':'var(--gold)')+';"></div></div>'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">'
        + '<span class="mono" style="font-size:11px;color:var(--ink-dim);">'+fmt(g.current,state.currency)+' / '+fmt(g.target,state.currency)+'</span>'
        + '<div style="display:flex;gap:6px;">'
        + '<input type="number" placeholder="amount" style="width:90px;margin:0;font-size:11px;padding:6px 8px;" data-goal-add="'+g.id+'" />'
        + '<button class="pill-btn" style="padding:6px 12px;font-size:11px;" data-goal-add-btn="'+g.id+'">+</button>'
        + '</div></div>'
        + '<div class="mono" style="font-size:9px;color:var(--ink-dim);margin-top:4px;">Adding here also logs it in your ledger and lowers your balance.</div></div>';
    });
    return html;
  }

  // ---------- render: bills ----------
  function renderBills(){
    var html = '<div class="tabhead"><h2 class="serif">Bills</h2><button class="pill-btn" id="billToggle">+ New bill</button></div>';
    html += '<div id="billForm" style="display:none;" class="card">'
      + '<input id="billName" placeholder="Bill name (e.g. Internet)" />'
      + '<input id="billAmount" type="number" placeholder="Amount" />'
      + '<input id="billDate" type="date" value="'+todayISO()+'" />'
      + '<button class="btn btn-teal" id="billSave">Save bill</button>'
      + '</div>';

    var sorted = state.bills.slice().sort(function(a,b){return a.dueDate.localeCompare(b.dueDate);});
    if (sorted.length===0) html += '<div class="empty">No bills tracked yet.</div>';
    sorted.forEach(function(b){
      var d = daysUntil(b.dueDate);
      html += '<div class="card" style="display:flex;justify-content:space-between;align-items:center;">'
        + '<div><div class="serif" style="font-size:14px;">'+esc(b.name)+'</div><div class="mono" style="font-size:11px;color:var(--ink-dim);">'+b.dueDate+' · '+fmt(b.amount,state.currency)+'</div></div>'
        + '<div style="display:flex;align-items:center;gap:10px;">'
        + '<span class="stamp '+((d<0||d<=3)?'red':'')+'">'+(d<0?'overdue':d<=3?'due soon':d+' days')+'</span>'
        + '<button class="del-btn" data-del-bill="'+b.id+'">✕</button></div></div>';
    });
    return html;
  }

  // ---------- render: journal ----------
  function renderJournal(){
    var html = '<div class="tabhead"><h2 class="serif">Finance Journal</h2></div>';
    html += '<div class="card">'
      + '<textarea id="journalText" rows="3" placeholder="Bought FC26 today. Worth it?"></textarea>'
      + '<div style="display:flex;gap:8px;margin-bottom:10px;">'
      + '<button id="worthYes" class="btn" style="width:auto;flex:1;background:transparent;border:1px solid var(--teal);color:var(--teal);">Worth it</button>'
      + '<button id="worthNo" class="btn" style="width:auto;flex:1;background:transparent;border:1px solid var(--red);color:var(--red);">Not worth it</button>'
      + '</div>'
      + '<button class="btn btn-gold" id="journalSave">Add entry</button>'
      + '</div>';
    if (state.journal.length===0) html += '<div class="empty">No entries yet — reflection helps cut impulse spending.</div>';
    state.journal.forEach(function(j){
      html += '<div class="card"><div style="display:flex;justify-content:space-between;">'
        + '<div style="font-size:13px;flex:1;">'+esc(j.text)+'</div>'
        + '<button class="del-btn" data-del-journal="'+j.id+'">✕</button></div>'
        + '<div style="display:flex;align-items:center;gap:8px;margin-top:8px;">'
        + '<span class="mono" style="font-size:10px;color:var(--ink-dim);">'+j.date+'</span>'
        + (j.worthIt===true?'<span class="stamp teal">Worth it</span>':'')
        + (j.worthIt===false?'<span class="stamp red">Regret</span>':'')
        + '</div></div>';
    });
    return html;
  }

  // ---------- render: advisor ----------
  function renderAdvisor(){
    var insights = computeInsights();
    var top = insights[0];
    var html = '<div class="tabhead"><h2 class="serif">Advisor</h2></div>';
    html += '<div class="card tip-hero"><div class="label">Today\'s tip</div>'
      + '<div style="font-size:13.5px;line-height:1.5;margin-top:6px;">'+top.text+'</div></div>';

    html += '<div class="card"><div class="serif" style="font-size:15px;margin-bottom:6px;">All alerts</div>';
    insights.forEach(function(i){
      html += '<div class="insight tone-'+i.tone+'"><span class="insight-dot"></span><span class="insight-text">'+i.text+'</span></div>';
    });
    html += '</div>';

    html += '<div class="empty" style="margin-top:4px;">Runs entirely on your own data, on this device — no internet needed, and nothing you type here leaves your phone.</div>';
    return html;
  }

  var pendingWorthIt = null;

  // ---------- add modal ----------
  var addType = "expense";
  var addCategory = "Food";
  function renderModal(){
    var catGrid = "";
    CATEGORIES.forEach(function(c){
      var sel = c.key===addCategory;
      catGrid += '<button data-pick-cat="'+c.key+'" class="'+(sel?'sel':'')+'" style="border-color:'+(sel?c.color:'')+';background:'+(sel?c.color+'22':'')+'"><span class="glyph">'+c.glyph+'</span><span class="name">'+c.key+'</span></button>';
    });
    var html = '<div class="modal-overlay" id="modalOverlay"><div class="modal">'
      + '<div class="modal-head"><div class="serif" style="font-size:17px;">New entry</div><button class="close-x" id="modalClose">✕</button></div>'
      + '<div class="type-toggle">'
      + '<button id="typeExpense" class="'+(addType==="expense"?'active-expense':'')+'">Expense</button>'
      + '<button id="typeIncome" class="'+(addType==="income"?'active-income':'')+'">Income</button>'
      + '</div>'
      + '<input id="txAmount" type="number" placeholder="Amount" style="font-size:17px;" />'
      + (addType==="expense" ? '<div class="catgrid">'+catGrid+'</div>' : '')
      + '<input id="txNote" placeholder="Note (optional)" />'
      + '<input id="txDate" type="date" value="'+todayISO()+'" />'
      + '<button class="btn btn-gold" id="txSave">Save entry</button>'
      + '</div></div>';
    return html;
  }

  function openModal(){
    document.getElementById("modalRoot").innerHTML = renderModal();
    bindModal();
  }
  function closeModal(){
    document.getElementById("modalRoot").innerHTML = "";
  }
  function bindModal(){
    document.getElementById("modalOverlay").addEventListener("click", function(e){
      if (e.target.id==="modalOverlay") closeModal();
    });
    document.getElementById("modalClose").addEventListener("click", closeModal);
    document.getElementById("typeExpense").addEventListener("click", function(){ addType="expense"; openModal(); });
    document.getElementById("typeIncome").addEventListener("click", function(){ addType="income"; openModal(); });
    var catBtns = document.querySelectorAll("[data-pick-cat]");
    catBtns.forEach(function(b){
      b.addEventListener("click", function(){ addCategory=b.getAttribute("data-pick-cat"); openModal(); });
    });
    document.getElementById("txSave").addEventListener("click", function(){
      var amount = document.getElementById("txAmount").value;
      if (!amount) return;
      var note = document.getElementById("txNote").value;
      var date = document.getElementById("txDate").value || todayISO();
      state.transactions.push({
        id: uid(), type: addType, amount: Number(amount),
        category: addType==="expense" ? addCategory : "Income",
        note: note, date: date
      });
      save();
      closeModal();
      renderApp();
    });
  }

  // ---------- main render / bindings ----------
  function renderApp(){
    var el = document.getElementById("content");
    if (tab==="dashboard") el.innerHTML = renderDashboard();
    else if (tab==="goals") el.innerHTML = renderGoals();
    else if (tab==="bills") el.innerHTML = renderBills();
    else if (tab==="journal") el.innerHTML = renderJournal();
    else if (tab==="advisor") el.innerHTML = renderAdvisor();
    bindContent();
    document.querySelectorAll(".tab-btn").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab")===tab);
    });
  }

  function bindContent(){
    // dashboard deletes
    document.querySelectorAll("[data-del-tx]").forEach(function(b){
      b.addEventListener("click", function(){
        state.transactions = state.transactions.filter(function(t){return t.id!==b.getAttribute("data-del-tx");});
        save(); renderApp();
      });
    });
    // goals
    var goalToggle = document.getElementById("goalToggle");
    if (goalToggle){
      goalToggle.addEventListener("click", function(){
        var f = document.getElementById("goalForm");
        f.style.display = f.style.display==="none" ? "block" : "none";
      });
      document.getElementById("goalSave").addEventListener("click", function(){
        var name = document.getElementById("goalName").value;
        var target = document.getElementById("goalTarget").value;
        var emoji = document.getElementById("goalEmoji").value || "🎯";
        if (!name || !target) return;
        state.goals.push({id:uid(), name:name, target:Number(target), current:0, emoji:emoji});
        save(); renderApp();
      });
    }
    document.querySelectorAll("[data-del-goal]").forEach(function(b){
      b.addEventListener("click", function(){
        state.goals = state.goals.filter(function(g){return g.id!==b.getAttribute("data-del-goal");});
        save(); renderApp();
      });
    });
    function contributeToGoal(id){
      var inp = document.querySelector('[data-goal-add="'+id+'"]');
      if (!inp || !inp.value || Number(inp.value)<=0) return;
      var amount = Number(inp.value);
      var goal = state.goals.find(function(g){ return g.id===id; });
      state.goals = state.goals.map(function(g){
        return g.id===id ? Object.assign({}, g, {current: g.current + amount}) : g;
      });
      state.transactions.push({
        id: uid(), type:"expense", category:"Savings",
        note: "→ " + (goal ? goal.name : "goal"), amount: amount, date: todayISO()
      });
      save(); renderApp();
    }
    document.querySelectorAll("[data-goal-add]").forEach(function(inp){
      inp.addEventListener("keydown", function(e){
        if (e.key==="Enter") contributeToGoal(inp.getAttribute("data-goal-add"));
      });
    });
    document.querySelectorAll("[data-goal-add-btn]").forEach(function(btn){
      btn.addEventListener("click", function(){ contributeToGoal(btn.getAttribute("data-goal-add-btn")); });
    });
    // bills
    var billToggle = document.getElementById("billToggle");
    if (billToggle){
      billToggle.addEventListener("click", function(){
        var f = document.getElementById("billForm");
        f.style.display = f.style.display==="none" ? "block" : "none";
      });
      document.getElementById("billSave").addEventListener("click", function(){
        var name = document.getElementById("billName").value;
        var amount = document.getElementById("billAmount").value;
        var date = document.getElementById("billDate").value || todayISO();
        if (!name || !amount) return;
        state.bills.push({id:uid(), name:name, amount:Number(amount), dueDate:date});
        save(); renderApp();
      });
    }
    document.querySelectorAll("[data-del-bill]").forEach(function(b){
      b.addEventListener("click", function(){
        state.bills = state.bills.filter(function(x){return x.id!==b.getAttribute("data-del-bill");});
        save(); renderApp();
      });
    });
    // journal
    var journalSave = document.getElementById("journalSave");
    if (journalSave){
      document.getElementById("worthYes").addEventListener("click", function(){ pendingWorthIt=true; highlightWorth(); });
      document.getElementById("worthNo").addEventListener("click", function(){ pendingWorthIt=false; highlightWorth(); });
      journalSave.addEventListener("click", function(){
        var text = document.getElementById("journalText").value;
        if (!text) return;
        state.journal.unshift({id:uid(), date:todayISO(), text:text, worthIt:pendingWorthIt});
        pendingWorthIt = null;
        save(); renderApp();
      });
    }
    document.querySelectorAll("[data-del-journal]").forEach(function(b){
      b.addEventListener("click", function(){
        state.journal = state.journal.filter(function(j){return j.id!==b.getAttribute("data-del-journal");});
        save(); renderApp();
      });
    });
  }
  function highlightWorth(){
    var y = document.getElementById("worthYes");
    var n = document.getElementById("worthNo");
    y.style.background = pendingWorthIt===true ? "var(--teal)" : "transparent";
    y.style.color = pendingWorthIt===true ? "var(--bg)" : "var(--teal)";
    n.style.background = pendingWorthIt===false ? "var(--red)" : "transparent";
    n.style.color = pendingWorthIt===false ? "var(--bg)" : "var(--red)";
  }

  function init(){
    state = load();
    document.getElementById("dateLine").textContent = new Date().toLocaleDateString("en-US",{weekday:"long", month:"long", day:"numeric"});

    var sel = document.getElementById("currencySelect");
    Object.keys(CURRENCIES).forEach(function(c){
      var o = document.createElement("option");
      o.value = c; o.textContent = c;
      if (c===state.currency) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", function(){ state.currency = sel.value; save(); renderApp(); });

    document.querySelectorAll(".tab-btn").forEach(function(b){
      b.addEventListener("click", function(){ tab = b.getAttribute("data-tab"); renderApp(); });
    });
    document.getElementById("addBtn").addEventListener("click", function(){ addType="expense"; addCategory="Food"; openModal(); });

    // standalone / install hint
    var isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
    if (!isStandalone){
      document.getElementById("installHint").innerHTML =
        '<div class="install-hint">📲 Tip: open your browser menu and choose <b>"Add to Home Screen"</b> to install this as an app icon on your phone.</div>';
    }

    renderApp();
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
